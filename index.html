
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamClarity</title>


<style>
body{background:#F6F3FF;font-family:Arial;margin:0;padding:16px}

.box{background:#fff;border:3px solid #000;border-radius:16px;padding:14px;margin-bottom:12px}
button{width:100%;padding:10px;border:3px solid #000;border-radius:10px;font-weight:900;margin-top:6px;cursor:pointer}

.peach{background:#FFC8A2}.lilac{background:#E8E0FF}.yellow{background:#FFF0B3}

.q{background:#F6F3FF;border:2px solid #000;border-radius:8px;padding:6px;margin-top:6px;font-size:13px}
</style>
</head>
<body>

<div style="max-width:800px;margin:0 auto;text-align:center;background:#fff;border:3px solid #000;border-radius:18px;padding:16px;margin-bottom:12px">
<h1>ExamClarity 🔮</h1>
<p>Made in Kerala 🎀</p>
<p>⭐ XP: <span id="xp">0</span></p>
</div>

<div style="max-width:800px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap">
<div style="flex:1;min-width:300px">

<div class="box">
<b>📋 Notes</b>
<textarea id="notes" rows="5" style="width:100%;border:2px solid #000;border-radius:8px;padding:8px" placeholder="Paste notes..."></textarea>
<select id="diff" style="width:100%;border:2px solid #000;border-radius:8px;padding:8px;margin-top:6px">
<option>Easy</option><option selected>Medium</option><option>Hard</option>
</select>
<button onclick="makeClear()" style="background:#7C5CFF;color:#fff">✨ Make it clear</button>
</div>

<div id="out" style="display:none" class="box">
<p id="score"></p>
<div id="sum"></div>
<button onclick="copySummary()" style="background:#FFD93D">📋 Copy summary</button>
<div id="keys"></div>
<div id="qs"></div>
<button onclick="revealAnswers()" style="background:#E8E0FF">🎯 Test myself - Reveal answers</button>
<p><b>🎲 Challenge:</b> <span id="chal"></span></p>
</div>

<div class="box yellow">
<b>🗒️ Sticky</b>
<textarea id="sticky" rows="3" style="width:100%;border:2px solid #000;border-radius:8px;padding:8px" placeholder="Must remember..."></textarea>
<button onclick="saveSticky()" style="background:#000;color:#fff">📌 Save</button>
<button onclick="clearSticky()" style="background:#fff">Clear</button>
<p id="saved"></p>
</div>

</div>

<div style="flex:0.7;min-width:250px">

<div class="box peach">
<b>⏰ Pomodoro</b>
<div id="timer" style="font-size:32px;font-weight:900;text-align:center">25:00</div>
<button onclick="startTimer()" style="background:#fff">▶️ Start / Pause</button>
<button onclick="resetTimer()" style="background:#000;color:#fff">Reset</button>
</div>

<div class="box lilac">
<b>🚀 NASA Real Pic</b>
<img id="apod" src="https://apod.nasa.gov/apod/image/2308/M31_HubbleSpitzer_960.jpg" style="width:100%;border:2px solid #000;border-radius:10px;margin-top:6px">
<p id="apodT" style="font-size:12px">Andromeda Galaxy</p>
</div>

<div class="box">
<b>📏 Count</b>
<p id="count">0 words</p>
</div>

</div>
</div>

<script>

var timeLeft = 1500;
var timerInterval = null;
var running = false;

function updateTimer(){
  var m = Math.floor(timeLeft/60);
  var s = timeLeft%60;
  document.getElementById('timer').innerHTML =
    (m<10?'0'+m:m) + ':' + (s<10?'0'+s:s);}


function startTimer(){
  if(running){
    clearInterval(timerInterval);
    running = false;
    return;}
  

  running = true;
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimer();

    if(timeLeft<=0){
      clearInterval(timerInterval);
      alert('Done! Break time 🌿');
      timeLeft = 1500;
      running = false;
      updateTimer();
    }
  },1000);}


function resetTimer(){
  clearInterval(timerInterval);
  timeLeft = 1500;
  running = false;
  updateTimer();}



// Sticky notes

function saveSticky(){
  var v = document.getElementById('sticky').value;
  localStorage.setItem('exam_sticky', v);
  document.getElementById('saved').innerText = 'Saved! ✨';

  setTimeout(function(){
    document.getElementById('saved').innerText='';
  },1500);}


function clearSticky(){
  localStorage.removeItem('exam_sticky');
  document.getElementById('sticky').value='';
  document.getElementById('saved').innerText='';}


var saved = localStorage.getItem('exam_sticky');
if(saved){
  document.getElementById('sticky').value = saved;}



// Word count

document.getElementById('notes').addEventListener('input', function(){
  var t = this.value.trim();
  var c = t==''?0:t.split(/\s+/).length;
  document.getElementById('count').innerText = c + ' words';});



// XP points

var xp = Number(localStorage.getItem('exam_xp')) || 0;

function updateXP(){
  document.getElementById('xp').innerText = xp;
  localStorage.setItem('exam_xp', xp);}


function earnXP(points){
  xp += points;
  updateXP();}


updateXP();


// Copy summary

function copySummary(){
  var summary = document.getElementById('sum').innerText;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(summary).then(function(){
      alert('Summary copied! 📋');})
    .catch(function(){
      alert('Could not copy. Try selecting the summary manually.'); });}
   
   else {
    alert('Please select and copy the summary manually.');}}
  



// Make notes clear

function makeClear(){

  var text = document.getElementById('notes').value;

  if(!text.trim()){
    alert('Paste notes');
    return;}
  

  document.getElementById('out').style.display='block';

  var w = text.trim().split(/\s+/).length;

  document.getElementById('score').innerText =
    'Score '+Math.min(100,Math.floor(w/4))+' pts | '+w+' words';


  // Summary

  var sens = text.split(/[.!?]+/)
    .filter(function(s){return s.trim().length>15})
    .slice(0,3);

  document.getElementById('sum').innerHTML =
    '<b>📌 3-Point Summary</b>' +
    sens.map(function(s,i){
      return '<div class="q"><b>'+(i+1)+'.</b> '+s.trim()+'</div>';})
    .join('');


  // Keywords

  var words = text.toLowerCase().match(/\b[a-z]{5,}\b/g) || [];

  var uniq = [...new Set(words)].filter(function(w){
    return w.length>4 &&
    !['about','their','which','would','there'].includes(w); })
 .slice(0,8);

  document.getElementById('keys').innerHTML =
    '<b>🔑 Keywords</b><br>' +
    uniq.map(function(k){
      return '<span style="background:#E8E0FF;border:2px solid #000;border-radius:10px;padding:2px 6px;margin:2px;display:inline-block;font-size:11px">'+k+'</span>'; })
   .join('');


  // Practice questions

  var diff = document.getElementById('diff').value;

  var sentences = text.split(/[.!?]+/)
    .filter(function(s){return s.trim().length>20});

  var questionTemplates = [

    function(){
      var s = sentences[Math.floor(Math.random()*sentences.length)];
      if(!s) return null;

      var parts = s.trim().split(' ');
      if(parts.length<6) return null;

      var mid = Math.floor(parts.length/2);
      var ans = parts[mid];
      parts[mid] = '______';

      return 'Fill in: "'+parts.join(' ')+'" (Answer: '+ans+')';},
    

    function(){
      var topic = uniq[Math.floor(Math.random()*uniq.length)] || 'this topic';

      if(diff=='Easy') return 'Explain '+topic+' in your own words (2 lines)';
      if(diff=='Hard') return 'Why is '+topic+' important? Give 2 reasons with example';

      return 'What is the main idea of '+topic+' and how does it work?'; },
   

    function(){
      if(sentences.length<2) return null;
      return 'True/False: '+sentences[0].trim().slice(0,80)+'...? Justify';},
    

    function(){
      var topic = uniq[Math.floor(Math.random()*uniq.length)] || 'the concept';
      return 'How would you teach '+topic+' to a 10-year-old?';  },
  

    function(){
      var topic = uniq[Math.floor(Math.random()*uniq.length)] || 'this';
      return 'Give one real-life example of '+topic;} ];
    

 


  var numQ = 5;
  var finalQs = [];
  var answerHTML = [];

  for(var i=0;i<numQ;i++){

    var fn = questionTemplates[i % questionTemplates.length];
    var q = fn();

    if(q){
      var answer = '';

      if(q.includes('(Answer:')){
        answer = q.split('(Answer:')[1].replace(')','').trim();
        q = q.split('(Answer:')[0];}
      

      finalQs.push(q);
      answerHTML.push(answer);}

     else {
      finalQs.push('Summarize the main point of your notes in 3 bullet points');
      answerHTML.push('Check your notes for the main ideas.');
    }}
  


  document.getElementById('qs').innerHTML =
    '<b>❓ Practice Questions ('+diff+')</b>' +
    finalQs.map(function(q,i){
      return '<div class="q"><b>Q'+(i+1)+':</b> '+q+
      '<div class="answer" style="display:none;color:#7C5CFF;margin-top:6px"><b>Answer:</b> '+answerHTML[i]+'</div></div>';
    }).join('');


  // Challenge

  var ch = [
    'Explain to a 10yo without seeing notes',
    'Write 5 keywords from memory in 1 min',
    '2 min brain dump - write all you remember',
    'Create your own hard question and answer it' ];
 

  document.getElementById('chal').innerText =
    ch[Math.floor(Math.random()*ch.length)];

  // Earn XP

  earnXP(10);}



// NASA picture

var apodImg = document.getElementById('apod');
var apodTitle = document.getElementById('apodT');

var fallbacks = [
  {url:"https://apod.nasa.gov/apod/image/2308/M31_HubbleSpitzer_960.jpg",title:"Andromeda Galaxy - NASA"},
  {url:"https://apod.nasa.gov/apod/image/2401/orion_nasa_960.jpg",title:"Orion Nebula - NASA"},
  {url:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=600",title:"Galaxy"}];


function setFallback(){
  var pick = fallbacks[Math.floor(Math.random()*fallbacks.length)];
  apodImg.onerror = null;
  apodImg.src = pick.url;
  apodTitle.innerText = pick.title;}


try{
  fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY")
    .then(function(r){
      if(!r.ok) throw new Error('NASA request failed');
      return r.json(); })
   
    .then(function(d){
      if(d.media_type==='image' && d.url){
        apodImg.src=d.url;
        apodTitle.innerText=d.title+' - NASA APOD Today';}
      else {
        setFallback(); }})
     
    
    .catch(function(){
      setFallback(); });}
   
 catch(e){
  setFallback();}


apodImg.onerror = function(){
  setFallback();};


updateTimer();

</script>
</body>
</html>
