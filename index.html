<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamClarity - Study Smarter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:20px;max-width:900px;margin:auto}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:20px;border-radius:16px;border:1px solid #334155;margin-bottom:20px;text-align:center}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0;border:1px solid #334155}
button{background:#38bdf8;color:#0f172a;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
textarea,select,input{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#0f172a;color:white;border:1px solid #334155}
.nasa-img{width:100%;border-radius:12px;max-height:400px;object-fit:cover}
.tag{display:inline-block;background:#334155;padding:4px 10px;border-radius:20px;font-size:12px;margin:3px}
h1{font-size:28px}h2{color:#38bdf8;margin-bottom:10px}
</style>
</head>
<body>
<div class="header"><h1>🧠 ExamClarity</h1><p>Study smarter. Learn better.</p><p style="font-size:12px;opacity:0.7">NASA + Study Assistant</p></div>

<div class="card" id="nasaCard"><h2>🚀 NASA Picture of the Day</h2><p id="nasaLoad">Loading...</p><img id="nasaImg" class="nasa-img" style="display:none"><h3 id="nasaTitle"></h3><p id="nasaExp" style="font-size:14px;opacity:0.8"></p></div>

<div class="card"><h2>Your Notes</h2>
<textarea id="notes" rows="6" placeholder="Paste your study material here... Example: Photosynthesis is process..."></textarea>
<select id="diff"><option>Easy</option><option selected>Medium</option><option>Hard</option></select>
<input type="number" id="num" value="5" min="1" max="10" placeholder="Number of questions">
<button onclick="analyze()">Analyze Notes</button>
</div>

<div id="results"></div>

<script>
async function loadNASA(){
try{
let r=await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
let d=await r.json();
document.getElementById('nasaLoad').style.display='none';
document.getElementById('nasaImg').src=d.url; document.getElementById('nasaImg').style.display='block';
document.getElementById('nasaTitle').innerText=d.title;
document.getElementById('nasaExp').innerText=d.explanation.substring(0,300)+'...';
}catch(e){document.getElementById('nasaLoad').innerText='NASA API limit - refresh later';}
}
loadNASA();

function analyze(){
let text=document.getElementById('notes').value;
let diff=document.getElementById('diff').value;
let n=parseInt(document.getElementById('num').value)||5;
if(!text.trim()){alert('Paste notes first!');return;}
let sentences=text.split(/[.!?]/).filter(s=>s.trim().length>10);
let summary=sentences.slice(0,3).map(s=>s.trim());
let defs=text.match(/[^.]*is[^.]*\./g)||[]; defs=defs.slice(0,3);
let questions=[];
for(let i=0;i<Math.min(n,sentences.length);i++){
let s=sentences[i].trim(); questions.push(`What is meant by: "${s.substring(0,80)}..."? (${diff})`);
}
let html=`<div class="card"><h2>📝 Summary</h2><ul>${summary.map(s=>`<li>${s}</li>`).join('')}</ul></div>
<div class="card"><h2>📚 Key Definitions</h2><ul>${defs.map(d=>`<li>${d}</li>`).join('')||'<li>No clear definitions found - try adding sentences with is/are</li>'}</ul></div>
<div class="card"><h2>❓ Practice Questions (${diff})</h2><ol>${questions.map(q=>`<li>${q}</li>`).join('')}</ol></div>
<div class="card"><h2>💡 Study Tips</h2><p>Difficulty: <span class="tag">${diff}</span> | Focus on definitions and repeat questions 2x for memory.</p></div>`;
document.getElementById('results').innerHTML=html;
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
