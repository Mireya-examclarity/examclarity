<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamClarity</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f3f4f6;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: auto;
            padding: 25px 0 50px;
        }

        /* Header */

        header {
            text-align: center;
            padding: 30px 15px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 34px;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        header p {
            color: #9ca3af;
        }

        .subtitle {
            font-size: 13px;
            margin-top: 5px;
        }

        /* Cards */

        .card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #60a5fa;
            margin-bottom: 15px;
            font-size: 21px;
        }

        /* NASA */

        .nasa-card {
            overflow: hidden;
        }

        .nasa-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 9px;
            margin-top: 10px;
        }

        #nasaTitle {
            margin-top: 12px;
            font-size: 19px;
        }

        #nasaExp {
            color: #9ca3af;
            margin-top: 7px;
            font-size: 14px;
        }

        #nasaLoad {
            color: #9ca3af;
        }

        /* Form */

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #d1d5db;
            font-size: 14px;
        }

        textarea,
        select,
        input {
            width: 100%;
            padding: 12px;
            background: #111827;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 160px;
        }

        textarea:focus,
        select:focus,
        input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            border: none;
            background: #3b82f6;
            color: white;
            padding: 13px;
            border-radius: 7px;
            margin-top: 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        /* Results */

        .result-list {
            padding-left: 22px;
        }

        .result-list li {
            margin-bottom: 10px;
        }

        .keyword {
            display: inline-block;
            background: #374151;
            color: #93c5fd;
            padding: 5px 10px;
            border-radius: 15px;
            margin: 3px;
            font-size: 13px;
        }

        .score {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #172033;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .score-number {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
        }

        .question {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .question small {
            color: #60a5fa;
        }

        .tip {
            background: #172033;
            border-left: 4px solid #60a5fa;
            padding: 14px;
            border-radius: 5px;
            color: #d1d5db;
        }

        .empty {
            color: #9ca3af;
        }

        footer {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-top: 30px;
        }

        /* Mobile */

        @media (max-width: 650px) {

            .container {
                width: 94%;
                padding-top: 10px;
            }

            header h1 {
                font-size: 28px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 17px;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>🧠 ExamClarity</h1>

        <p>
            Turn your notes into something easier to study.
        </p>

        <p class="subtitle">
            Summaries • Questions • Definitions • Study Tips
        </p>

    </header>


    <!-- NASA -->

    <div class="card nasa-card">

        <h2>🚀 Today's Space Picture</h2>

        <p id="nasaLoad">
            Loading NASA picture...
        </p>

        <img
            id="nasaImg"
            class="nasa-img"
            style="display:none;"
            alt="NASA picture of the day"
        >

        <h3 id="nasaTitle"></h3>

        <p id="nasaExp"></p>

    </div>


    <!-- Notes -->

    <div class="card">

        <h2>📚 Your Notes</h2>

        <textarea
            id="notes"
            placeholder="Paste your notes here..."
        ></textarea>


        <div class="form-row">

            <div>

                <label for="diff">
                    Question difficulty
                </label>

                <select id="diff">

                    <option>Easy</option>

                    <option selected>
                        Medium
                    </option>

                    <option>Hard</option>

                </select>

            </div>


            <div>

                <label for="num">
                    Number of questions
                </label>

                <input
                    type="number"
                    id="num"
                    value="5"
                    min="1"
                    max="20"
                >

            </div>

        </div>


        <button onclick="analyzeNotes()">
            Analyze My Notes
        </button>

    </div>


    <!-- Results -->

    <div id="results"></div>


    <footer>
        ExamClarity • Made as a student study project
    </footer>

</div>


<script>

    // -------------------------
    // NASA Picture
    // -------------------------

    async function loadNASA() {

        const loading = document.getElementById("nasaLoad");
        const image = document.getElementById("nasaImg");
        const title = document.getElementById("nasaTitle");
        const explanation = document.getElementById("nasaExp");

        try {

            const response = await fetch(
                "https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY"
            );

            const data = await response.json();

            if (data.media_type !== "image") {
                loading.innerText = "Today's NASA post is not an image.";
                return;
            }

            loading.style.display = "none";

            image.src = data.url;
            image.style.display = "block";

            title.innerText = data.title;

            explanation.innerText =
                data.explanation.substring(0, 350) + "...";

        }

        catch (error) {

            loading.innerText =
                "Couldn't load the NASA picture right now.";

        }

    }


    // -------------------------
    // Analyze Notes
    // -------------------------

    function analyzeNotes() {

        const notes =
            document.getElementById("notes").value.trim();

        const difficulty =
            document.getElementById("diff").value;

        let number =
            parseInt(document.getElementById("num").value);

        if (!notes) {

            alert("Please paste your notes first.");

            return;
        }

        if (!number || number < 1) {
            number = 5;
        }

        /*
            This part is only a small preview.
            The main analysis is done by Flask.
        */

        const words =
            notes.match(/\b[a-zA-Z]+\b/g) || [];

        const sentences =
            notes
                .split(/[.!?]+/)
                .filter(sentence => sentence.trim().length > 10);


        // Pick a few words to show as keywords

        const commonWords = {};

        words.forEach(word => {

            word = word.toLowerCase();

            if (word.length > 4) {

                if (commonWords[word]) {
                    commonWords[word]++;
                } else {
                    commonWords[word] = 1;
                }

            }

        });


        const keywords =
            Object.keys(commonWords)
                .sort(
                    (a, b) =>
                        commonWords[b] - commonWords[a]
                )
                .slice(0, 8);


        // Create a simple preview

        let html = "";

        html += `
            <div class="card">

                <h2>📊 Quick Look</h2>

                <div class="score">

                    <div>
                        <strong>
                            Your notes contain
                        </strong>

                        <br>

                        ${words.length} words
                    </div>

                    <div class="score-number">
                        ${Math.min(
                            100,
                            Math.round(words.length / 2)
                        )}%
                    </div>

                </div>

                <p>
                    ${sentences.length}
                    sentences found.
                </p>

            </div>
        `;


        // Keywords

        html += `
            <div class="card">

                <h2>🔑 Possible Key Topics</h2>

                <div>
        `;

        if (keywords.length > 0) {

            keywords.forEach(word => {

                html += `
                    <span class="keyword">
                        ${word}
                    </span>
                `;

            });

        } else {

            html += `
                <p class="empty">
                    Not enough information to find keywords.
                </p>
            `;

        }

        html += `
                </div>

            </div>
        `;


        // Simple questions

        html += `
            <div class="card">

                <h2>
                    ❓ Quick Practice
                </h2>
        `;


        const questionCount =
            Math.min(number, sentences.length);


        for (
            let i = 0;
            i < questionCount;
            i++
        ) {

            const sentence =
                sentences[i].trim();

            html += `
                <div class="question">

                    <small>
                        ${difficulty}
                    </small>

                    <p>
                        What is the main idea of:
                        "${sentence.substring(0, 100)}..."
                    </p>

                </div>
            `;

        }


        if (questionCount === 0) {

            html += `
                <p class="empty">
                    Add more notes to generate questions.
                </p>
            `;

        }


        html += `
            </div>
        `;


        // Study tip

        html += `
            <div class="card">

                <h2>💡 Study Tip</h2>

                <div class="tip">

                    Don't just read your notes again.
                    Try explaining one concept without
                    looking at the answer.

                </div>

            </div>
        `;


        document.getElementById("results").innerHTML =
            html;


        // Move down to the results

        document.getElementById("results")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    // Load NASA when page opens

    loadNASA();

</script>

</body>

</html>
